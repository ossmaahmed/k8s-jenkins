apiVersion: apps/v1
kind: Deployment  
metadata:
  name: my-deployment
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      imagePullSecrets:
      - name: docker-registry
      containers:
      - name: my-container
        image: my-image
        ports:
        - containerPort: 8082